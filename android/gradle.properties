org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.7.3 was tested up to compileSdk 35; compileSdk 36 works but emits a warning on every
# build. Suppressed deliberately per docs/TIMEOS_ENGINEERING_SPEC.md §4.3 (build-tools 36.0.0 is
# the installed toolchain). Revisit once a newer AGP officially supports compileSdk 36.
android.suppressUnsupportedCompileSdk=36
