# L2 seed catalogue for browser telemetry (§15.2, §38 Phase 10): curated registrable-domain ->
# category priors, mirroring app_priors.yaml's format and confidence conventions exactly (0.55-
# 0.80 band; a seed guess should always lose to a real learned prior or user rule once one
# exists). Keys are registrable domains exactly as `extension/src/lib/psl.ts` reduces them —
# never a full URL, never a subdomain distinct from its registrable domain.
#
# This is a starting point, not an exhaustive catalogue — a domain missing here classifies as
# Unknown (§15.2: "a success state, not a failure") until the user corrects it or enough
# unprompted samples accumulate.

