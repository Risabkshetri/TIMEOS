# L2 seed catalogue (§15.2): curated package -> category priors shipped with the app.
#
# `confidence` is deliberately kept in the 0.55-0.80 band the spec assigns to this layer — never
# higher, since a seed guess about what a package is "usually" used for should always lose to a
# real learned prior (L1) or user rule (L0) once one exists. Keys are android package names
# exactly as they appear in a raw_events APP_FOREGROUND payload's "package" field; `category`
# values must match a key in timeos/jobs/seed_categories.py's TAXONOMY.
#
# This is a starting point, not an exhaustive catalogue — an app missing here classifies as
# Unknown (§15.2: "a success state, not a failure") until the user corrects it or enough
# unprompted samples accumulate.

