[project]
name = "timeos-backend"
version = "0.1.0"
description = "TimeOS backend: ingestion, deterministic analytics, privacy gate, AI analyst"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["timeos*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated by `alembic revision --autogenerate`; not meant to be hand-reformatted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's DI pattern (Depends(...) as an argument default) is intentional, not the mutable-
# default-argument bug B008 targets — see https://fastapi.tiangolo.com/tutorial/dependencies/.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The async engine in timeos/db.py is created once at module import time; its connection pool
# is bound to whichever event loop existed then. pytest-asyncio's default is a fresh loop PER
# TEST, which breaks that pool on the second test ("attached to a different loop"). A
# session-scoped loop keeps one loop for the whole run, matching the engine's own lifetime.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.importlinter]
root_package = "timeos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AI layer may not touch data layer"
type = "forbidden"
source_modules = ["timeos.ai"]
forbidden_modules = [
    "timeos.models",
    "timeos.db",
    "sqlalchemy",
    "asyncpg",
]
