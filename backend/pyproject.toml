[project]
name = "timeos-backend"
version = "0.1.0"
description = "TimeOS backend: ingestion, deterministic analytics, privacy gate, AI analyst"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["timeos*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.importlinter]
root_package = "timeos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "AI layer may not touch data layer"
type = "forbidden"
source_modules = ["timeos.ai"]
forbidden_modules = [
    "timeos.models",
    "timeos.db",
    "sqlalchemy",
    "asyncpg",
]
