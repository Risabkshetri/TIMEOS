# gitleaks config — scans for accidentally committed secrets.
# Run locally: gitleaks detect --source . --config .gitleaks.toml
# Enforced in CI (.github/workflows/ci.yml) on every push.

title = "timeos-gitleaks"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
]
